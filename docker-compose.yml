services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: services
      POSTGRES_USER: services
      POSTGRES_PASSWORD: services
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U services -d services"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
